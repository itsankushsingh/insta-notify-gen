<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Follow Notification Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Text:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            width: 250px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: none;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            background-color: #d62976;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #capture-area {
            margin-top: 30px;
            padding: 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 400px;
            display: none;
        }

        .insta-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/2048px-Instagram_logo_2016.svg.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            flex-shrink: 0;
        }

        .text-area {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .app-name {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Instagram Follow Notification Generator</h2>
        <input type="text" id="username" placeholder="Enter Instagram username" />
        <br>
        <button onclick="generateNotification()">Generate</button>
        <button id="downloadBtn" onclick="downloadImage()" style="display:none">Download Image</button>

        <div id="capture-area">
            <div class="insta-icon"></div>
            <div class="text-area">
                <div class="app-name">Instagram</div>
                <div id="notification-text"></div>
            </div>
        </div>
    </div>

    <script>
        let currentUsername = "";

        function generateNotification() {
            const usernameInput = document.getElementById("username");
            const username = usernameInput.value.trim();
            if (username === "") {
                alert("Please enter a username.");
                return;
            }
            currentUsername = username;
            document.getElementById("notification-text").innerText = `${username} started following you.`;
            document.getElementById("capture-area").style.display = "flex";
            document.getElementById("downloadBtn").style.display = "inline-block";
        }

        function downloadImage() {
            const captureArea = document.getElementById("capture-area");
            if (captureArea.style.display === "none") {
                alert("Please generate a notification first.");
                return;
            }
            html2canvas(captureArea, {
                useCORS: true,
                backgroundColor: null,
                allowTaint: true,
                logging: true,
                scale: 10
            }).then(canvas => {
                const link = document.createElement("a");
                const safeUsername = currentUsername.replace(/[^a-zA-Z0-9_-]/g, "_");
                link.download = `${safeUsername || 'notification'}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>

</html>
